# Container configuration used by ./exec.bash
#
# Don't start this file with "docker compose -f docker-compose.exec.bash.yml up" directly, use ./exec.bash
# exec.bash sets the variables used below (based on settings.bash) and adds the
# files from .docker_scripts/compose/ depending on the exec mode and the enabled
# options (x server, gpu, ccache, ssh agent, icecc, docker in container), as well as
# the ADDITIONAL_DOCKER_RUN_ARGS of settings.bash (translated to docker compose).
#
# Project specific run parameters (ports, volumes, network mode, ...) can be set
# via ADDITIONAL_DOCKER_RUN_ARGS in settings.bash, or added to the "workspace" service below
# (e.g. if there is no docker run argument for it).
# Relative paths are relative to this folder.
# Additional services (e.g. a database) are started along with the workspace container.
#
# Changes are detected by ./exec.bash, which then offers to renew the container.
# To print the complete configuration of the container, run: VERBOSE=true ./exec.bash
# A standalone docker-compose.yml without variables is generated by ./tools/generate_standalone_compose.bash
# (./exec.bash regenerates it when this file, settings.bash or the scripts change)

services:
  workspace:
    image: ${IMAGE_NAME:?is not set, please use ./exec.bash to start the container}
    container_name: ${CONTAINER_NAME:?is not set, please use ./exec.bash to start the container}
    # the entrypoint needs root to set up the user id on the initial start
    user: root
    # keep the default shell running, ./exec.bash runs commands via docker exec
    tty: true
    stdin_open: true
    environment:
      NUID: ${NUID}
      NGID: ${NGID}
      EXECMODE: ${EXECMODE}
      PROJECT_NAME: ${PROJECT_NAME}
      SCRIPTSVERSION: ${SCRIPTSVERSION}
      PRINT_WARNING: ${PRINT_WARNING}
      PRINT_INFO: ${PRINT_INFO}
      PRINT_DEBUG: ${PRINT_DEBUG}

    ### project specific run parameters, often used:
    # network_mode: host
    # privileged: true
    # dns_search: mydomain
    # ports:
    #   - "7890:7890"
    # volumes:
    #   - /path/on/host:/path/in/container
